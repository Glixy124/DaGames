<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #080c14; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .wrap {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .hud {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      background: linear-gradient(180deg, rgba(8,12,20,0.88) 0%, rgba(8,12,20,0) 100%);
      font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600;
    }
    .hud-group { display: flex; align-items: center; gap: 18px; }
    .hud-label { color: #94a3b8; font-weight: 500; margin-right: 6px; }
    .hud-val { color: #f8fafc; font-family: ui-monospace, SFMono-Regular, monospace; }
    .btn-mini {
      background: rgba(255,255,255,0.08); color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-mini:hover { background: rgba(255,255,255,0.14); }
    canvas {
      width: 100%; height: 100%; display: block;
      max-width: 960px; max-height: 640px;
      border-radius: 8px;
    }
    .overlay {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(8,12,20,0.82); backdrop-filter: blur(6px);
      text-align: center; padding: 24px;
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
    .overlay p { color: #94a3b8; font-size: 14px; max-width: 380px; line-height: 1.5; margin-bottom: 22px; }
    .btn-primary {
      background: #f59e0b; color: #090d16; border: none; border-radius: 8px;
      padding: 12px 26px; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-primary:hover { background: #fbbf24; transform: translateY(-1px); }
    .score-summary {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 18px; color: #f59e0b; margin-bottom: 18px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="hud-group">
        <div><span class="hud-label">Score</span><span class="hud-val" id="scoreVal">0</span></div>
        <div><span class="hud-label">Wave</span><span class="hud-val" id="waveVal">1</span></div>
        <div><span class="hud-label">Hull</span><span class="hud-val" id="livesVal">3</span></div>
        <div><span class="hud-label">Best</span><span class="hud-val" id="bestVal">0</span></div>
      </div>
      <button class="btn-mini" id="muteBtn" type="button">Sound: On</button>
    </div>

    <canvas id="gameCanvas" width="800" height="560"></canvas>

    <div class="overlay" id="startOverlay">
      <h1>Orbital Defender</h1>
      <p>Move with Left/Right Arrows or A/D. Hold Space to fire twin pulse cannons and clear incoming waves.</p>
      <button class="btn-primary" id="startBtn" type="button">Start Game</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h1>Mission Ended</h1>
      <div class="score-summary" id="finalScore">Score: 0 · Wave 1</div>
      <p>Your hull integrity reached zero. Launch another interceptor to beat your record.</p>
      <button class="btn-primary" id="restartBtn" type="button">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreVal');
    const waveEl = document.getElementById('waveVal');
    const livesEl = document.getElementById('livesVal');
    const bestEl = document.getElementById('bestVal');
    const startOverlay = document.getElementById('startOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const finalScoreEl = document.getElementById('finalScore');
    const muteBtn = document.getElementById('muteBtn');

    let audioCtx = null;
    let muted = false;
    function beep(freq, dur, type = 'square', vol = 0.05) {
      if (muted) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    muteBtn.addEventListener('click', () => {
      muted = !muted;
      muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
    });

    const BEST_KEY = 'vp_orbital_best';
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;

    const keys = {};
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space',' '].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      s: Math.random() * 1.8 + 0.5,
      v: Math.random() * 35 + 15
    }));

    let state = 'MENU';
    let player, bullets, enemyBullets, enemies, particles, score, wave, lives, fireCooldown, waveDir, lastTime;

    function spawnWave(w) {
      enemies = [];
      const rows = Math.min(4 + Math.floor(w / 2), 6);
      const cols = Math.min(7 + Math.floor(w / 3), 10);
      const startX = (canvas.width - (cols - 1) * 58) / 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: startX + c * 58,
            y: 78 + r * 44,
            w: 32, h: 24,
            hp: r === 0 && w > 1 ? 2 : 1,
            type: r === 0 ? 'elite' : r === 1 ? 'scout' : 'drone'
          });
        }
      }
      waveDir = 1;
    }

    function initGame() {
      player = { x: canvas.width / 2, y: canvas.height - 46, w: 36, h: 28, speed: 360, invuln: 0 };
      bullets = [];
      enemyBullets = [];
      particles = [];
      score = 0;
      wave = 1;
      lives = 3;
      fireCooldown = 0;
      spawnWave(wave);
      updateHud();
      state = 'PLAYING';
      startOverlay.classList.add('hidden');
      overOverlay.classList.add('hidden');
      lastTime = performance.now();
    }

    function updateHud() {
      scoreEl.textContent = score;
      waveEl.textContent = wave;
      livesEl.textContent = lives;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      bestEl.textContent = best;
    }

    function addExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = Math.random() * 140 + 40;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });
      }
    }

    function update(dt) {
      for (const st of stars) {
        st.y += st.v * dt;
        if (st.y > canvas.height) { st.y = 0; st.x = Math.random() * canvas.width; }
      }
      if (state !== 'PLAYING') return;

      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed * dt;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * dt;
      player.x = Math.max(28, Math.min(canvas.width - 28, player.x));
      if (player.invuln > 0) player.invuln -= dt;

      fireCooldown -= dt;
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && fireCooldown <= 0) {
        bullets.push({ x: player.x - 10, y: player.y - 16, vy: -520 });
        bullets.push({ x: player.x + 10, y: player.y - 16, vy: -520 });
        fireCooldown = 0.22;
        beep(540, 0.07, 'triangle', 0.04);
      }

      bullets = bullets.filter(b => {
        b.y += b.vy * dt;
        return b.y > -20;
      });

      enemyBullets = enemyBullets.filter(b => {
        b.y += b.vy * dt;
        return b.y < canvas.height + 20;
      });

      const speedX = (42 + wave * 12 + (40 - Math.min(enemies.length, 40)) * 1.4) * waveDir;
      let hitEdge = false;
      for (const en of enemies) {
        en.x += speedX * dt;
        if (en.x < 34 || en.x > canvas.width - 34) hitEdge = true;
      }
      if (hitEdge) {
        waveDir *= -1;
        for (const en of enemies) {
          en.y += 18;
          if (en.y >= player.y - 16) {
            lives = 0;
          }
        }
      }

      if (enemies.length > 0 && Math.random() < (0.8 + wave * 0.35) * dt) {
        const shooter = enemies[Math.floor(Math.random() * enemies.length)];
        enemyBullets.push({ x: shooter.x, y: shooter.y + 14, vy: 220 + wave * 20 });
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
          const en = enemies[j];
          if (Math.abs(b.x - en.x) < en.w / 2 + 4 && Math.abs(b.y - en.y) < en.h / 2 + 6) {
            hit = true;
            en.hp -= 1;
            if (en.hp <= 0) {
              score += en.type === 'elite' ? 150 : en.type === 'scout' ? 100 : 60;
              addExplosion(en.x, en.y, en.type === 'elite' ? '#f59e0b' : '#38bdf8', 14);
              enemies.splice(j, 1);
              beep(220, 0.11, 'sawtooth', 0.04);
            } else {
              addExplosion(en.x, en.y, '#e2e8f0', 5);
              beep(380, 0.05, 'square', 0.03);
            }
            updateHud();
            break;
          }
        }
        if (hit) bullets.splice(i, 1);
      }

      if (player.invuln <= 0) {
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const b = enemyBullets[i];
          if (Math.abs(b.x - player.x) < 18 && Math.abs(b.y - player.y) < 14) {
            enemyBullets.splice(i, 1);
            lives -= 1;
            player.invuln = 1.4;
            addExplosion(player.x, player.y, '#ef4444', 18);
            beep(120, 0.25, 'sawtooth', 0.06);
            updateHud();
            break;
          }
        }
      }

      particles = particles.filter(p => {
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        return p.life > 0;
      });

      if (lives <= 0) {
        state = 'OVER';
        finalScoreEl.textContent = `Score: ${score} · Wave ${wave}`;
        overOverlay.classList.remove('hidden');
        return;
      }

      if (enemies.length === 0) {
        wave += 1;
        score += 250;
        spawnWave(wave);
        updateHud();
        beep(660, 0.18, 'triangle', 0.05);
      }
    }

    function draw() {
      ctx.fillStyle = '#080c14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const st of stars) {
        ctx.fillStyle = `rgba(226,232,240,${0.25 + st.s * 0.25})`;
        ctx.fillRect(st.x, st.y, st.s, st.s);
      }

      if (state === 'PLAYING' || state === 'OVER') {
        // Player ship
        if (player.invuln <= 0 || Math.floor(player.invuln * 12) % 2 === 0) {
          ctx.save();
          ctx.translate(player.x, player.y);
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.moveTo(0, -16);
          ctx.lineTo(18, 12);
          ctx.lineTo(6, 8);
          ctx.lineTo(0, 14);
          ctx.lineTo(-6, 8);
          ctx.lineTo(-18, 12);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-4, -4, 8, 9);
          ctx.restore();
        }

        // Bullets
        ctx.fillStyle = '#fbbf24';
        for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12);

        ctx.fillStyle = '#fb7185';
        for (const b of enemyBullets) ctx.fillRect(b.x - 2, b.y - 5, 4, 10);

        // Enemies
        for (const en of enemies) {
          ctx.save();
          ctx.translate(en.x, en.y);
          ctx.fillStyle = en.type === 'elite' ? '#f59e0b' : en.type === 'scout' ? '#38bdf8' : '#94a3b8';
          ctx.beginPath();
          ctx.moveTo(-14, -8);
          ctx.lineTo(14, -8);
          ctx.lineTo(10, 10);
          ctx.lineTo(4, 5);
          ctx.lineTo(-4, 5);
          ctx.lineTo(-10, 10);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#080c14';
          ctx.fillRect(-7, -3, 4, 4);
          ctx.fillRect(3, -3, 4, 4);
          ctx.restore();
        }

        // Particles
        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, p.life / 0.45);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;
      }
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    lastTime = performance.now();
    requestAnimationFrame(loop);

    document.getElementById('startBtn').addEventListener('click', initGame);
    document.getElementById('restartBtn').addEventListener('click', initGame);
  </script>
</body>
</html>
