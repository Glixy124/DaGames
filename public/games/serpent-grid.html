<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serpent Grid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0b0f17; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .wrap {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; gap: 12px;
    }
    .hud {
      width: 100%; max-width: 520px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .hud-stats { display: flex; gap: 16px; }
    .label { color: #94a3b8; font-weight: 500; margin-right: 6px; }
    .val { font-family: ui-monospace, monospace; color: #f8fafc; }
    .btn-mini {
      background: #161b22; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-mini:hover { background: #1f2937; }
    .stage {
      position: relative; width: 100%; max-width: 520px; aspect-ratio: 1 / 1;
      border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1); background: #111827;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(11,15,23,0.85); backdrop-filter: blur(5px);
      text-align: center; padding: 24px; gap: 14px;
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 28px; font-weight: 700; }
    .overlay p { font-size: 13px; color: #94a3b8; max-width: 320px; line-height: 1.5; }
    .btn-primary {
      background: #10b981; color: #052e16; border: none; border-radius: 8px;
      padding: 11px 24px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="hud-stats">
        <div><span class="label">Score</span><span class="val" id="scoreEl">0</span></div>
        <div><span class="label">Best</span><span class="val" id="bestEl">0</span></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-mini" id="modeBtn" type="button">Walls: Solid</button>
        <button class="btn-mini" id="pauseBtn" type="button">Pause</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="c" width="480" height="480"></canvas>
      <div class="overlay" id="menuOverlay">
        <h1>Serpent Grid</h1>
        <p>Steer with Arrow Keys or WASD. Collect energy apples to grow without hitting yourself.</p>
        <button class="btn-primary" id="startBtn" type="button">Start Game</button>
      </div>
      <div class="overlay hidden" id="overOverlay">
        <h1>Collision Detected</h1>
        <p id="overText">Final Score: 0</p>
        <button class="btn-primary" id="againBtn" type="button">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const CELL = canvas.width / GRID;
    const scoreEl = document.getElementById('scoreEl');
    const bestEl = document.getElementById('bestEl');
    const modeBtn = document.getElementById('modeBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const overText = document.getElementById('overText');

    const BEST_KEY = 'vp_snake_best';
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;

    let wrapWalls = false;
    modeBtn.addEventListener('click', () => {
      wrapWalls = !wrapWalls;
      modeBtn.textContent = wrapWalls ? 'Walls: Wrap' : 'Walls: Solid';
    });

    let snake, dir, nextDir, food, score, paused, running, timer;

    function placeFood() {
      while (true) {
        const fx = Math.floor(Math.random() * GRID);
        const fy = Math.floor(Math.random() * GRID);
        if (!snake.some(s => s.x === fx && s.y === fy)) {
          food = { x: fx, y: fy };
          return;
        }
      }
    }

    function start() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      paused = false;
      running = true;
      pauseBtn.textContent = 'Pause';
      scoreEl.textContent = 0;
      placeFood();
      menuOverlay.classList.add('hidden');
      overOverlay.classList.add('hidden');
      clearInterval(timer);
      timer = setInterval(tick, 105);
      draw();
    }

    pauseBtn.addEventListener('click', () => {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    });

    function tick() {
      if (!running || paused) return;
      dir = nextDir;
      let nx = snake[0].x + dir.x;
      let ny = snake[0].y + dir.y;

      if (wrapWalls) {
        nx = (nx + GRID) % GRID;
        ny = (ny + GRID) % GRID;
      } else if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) {
        return gameOver();
      }

      if (snake.some(seg => seg.x === nx && seg.y === ny)) {
        return gameOver();
      }

      snake.unshift({ x: nx, y: ny });
      if (nx === food.x && ny === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
        }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function gameOver() {
      running = false;
      clearInterval(timer);
      overText.textContent = `Final Score: ${score} · Best: ${best}`;
      overOverlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#0f1623';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
      }

      if (food) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }

      if (snake) {
        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
          ctx.fillRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4);
        });
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'Space' && running) {
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        return;
      }
      if ((e.code === 'ArrowUp' || e.code === 'KeyW') && dir.y !== 1) nextDir = { x: 0, y: -1 };
      if ((e.code === 'ArrowDown' || e.code === 'KeyS') && dir.y !== -1) nextDir = { x: 0, y: 1 };
      if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && dir.x !== 1) nextDir = { x: -1, y: 0 };
      if ((e.code === 'ArrowRight' || e.code === 'KeyD') && dir.x !== -1) nextDir = { x: 1, y: 0 };
    });

    document.getElementById('startBtn').addEventListener('click', start);
    document.getElementById('againBtn').addEventListener('click', start);
    draw();
  </script>
</body>
</html>
