<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0b0f17; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .wrap {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 14px;
    }
    .hud {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; font-size: 13px; font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, rgba(11,15,23,0.9) 0%, rgba(11,15,23,0) 100%);
    }
    .hud-group { display: flex; gap: 18px; }
    .label { color: #94a3b8; font-weight: 500; margin-right: 6px; }
    .val { font-family: ui-monospace, monospace; color: #f8fafc; }
    canvas {
      width: 100%; height: 100%; max-width: 820px; max-height: 540px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
      background: #0f1622; display: block; cursor: none;
    }
    .overlay {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(11,15,23,0.84); backdrop-filter: blur(5px);
      text-align: center; padding: 24px; gap: 12px;
    }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 30px; font-weight: 700; }
    .overlay p { font-size: 13px; color: #94a3b8; max-width: 360px; line-height: 1.5; }
    .btn-primary {
      background: #f59e0b; color: #0b0f17; border: none; border-radius: 8px;
      padding: 11px 24px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="hud-group">
        <div><span class="label">Score</span><span class="val" id="scoreEl">0</span></div>
        <div><span class="label">Level</span><span class="val" id="levelEl">1</span></div>
        <div><span class="label">Lives</span><span class="val" id="livesEl">3</span></div>
        <div><span class="label">Best</span><span class="val" id="bestEl">0</span></div>
      </div>
    </div>

    <canvas id="c" width="760" height="500"></canvas>

    <div class="overlay" id="menuOverlay">
      <h1>Prism Breaker</h1>
      <p>Move the paddle with your mouse, Arrow Keys, or A/D. Deflect the sphere to clear every brick tier.</p>
      <button class="btn-primary" id="startBtn" type="button">Start Game</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h1 id="overTitle">Game Over</h1>
      <p id="overMsg">Score: 0</p>
      <button class="btn-primary" id="againBtn" type="button">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const levelEl = document.getElementById('levelEl');
    const livesEl = document.getElementById('livesEl');
    const bestEl = document.getElementById('bestEl');
    const menuOverlay = document.getElementById('menuOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const overTitle = document.getElementById('overTitle');
    const overMsg = document.getElementById('overMsg');

    const BEST_KEY = 'vp_prism_best';
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;

    const ROW_COLORS = ['#fb7185', '#f97316', '#f59e0b', '#10b981', '#38bdf8'];
    let state = 'MENU';
    let paddle, ball, bricks, score, lives, level, lastTime;
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    canvas.addEventListener('mousemove', (e) => {
      if (state !== 'PLAYING') return;
      const rect = canvas.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width) * canvas.width;
      paddle.x = Math.max(paddle.w / 2 + 8, Math.min(canvas.width - paddle.w / 2 - 8, mx));
    });

    function buildBricks(lvl) {
      bricks = [];
      const rows = Math.min(4 + lvl, 6);
      const cols = 10;
      const bw = 64;
      const bh = 20;
      const gap = 8;
      const offsetX = (canvas.width - (cols * bw + (cols - 1) * gap)) / 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: offsetX + c * (bw + gap),
            y: 62 + r * (bh + gap),
            w: bw, h: bh,
            hp: r === 0 && lvl > 1 ? 2 : 1,
            color: ROW_COLORS[r % ROW_COLORS.length]
          });
        }
      }
    }

    function resetBall() {
      const speed = 320 + level * 25;
      const angle = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
      ball = {
        x: paddle.x, y: paddle.y - 14, r: 7,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        speed
      };
    }

    function init() {
      paddle = { x: canvas.width / 2, y: canvas.height - 32, w: 108, h: 12, speed: 460 };
      score = 0;
      lives = 3;
      level = 1;
      buildBricks(level);
      resetBall();
      updateHud();
      state = 'PLAYING';
      menuOverlay.classList.add('hidden');
      overOverlay.classList.add('hidden');
      lastTime = performance.now();
    }

    function updateHud() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = lives;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      bestEl.textContent = best;
    }

    function update(dt) {
      if (state !== 'PLAYING') return;

      if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed * dt;
      if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed * dt;
      paddle.x = Math.max(paddle.w / 2 + 8, Math.min(canvas.width - paddle.w / 2 - 8, paddle.x));

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

      if (
        ball.vy > 0 &&
        ball.y + ball.r >= paddle.y - paddle.h / 2 &&
        ball.y - ball.r <= paddle.y + paddle.h / 2 &&
        ball.x >= paddle.x - paddle.w / 2 - ball.r &&
        ball.x <= paddle.x + paddle.w / 2 + ball.r
      ) {
        const hitPos = (ball.x - paddle.x) / (paddle.w / 2);
        const angle = -Math.PI / 2 + hitPos * (Math.PI / 3);
        ball.speed = Math.min(540, ball.speed + 4);
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
        ball.y = paddle.y - paddle.h / 2 - ball.r;
      }

      for (let i = bricks.length - 1; i >= 0; i--) {
        const b = bricks[i];
        if (
          ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h
        ) {
          const overlapLeft = ball.x + ball.r - b.x;
          const overlapRight = b.x + b.w - (ball.x - ball.r);
          const overlapTop = ball.y + ball.r - b.y;
          const overlapBottom = b.y + b.h - (ball.y - ball.r);
          const minX = Math.min(overlapLeft, overlapRight);
          const minY = Math.min(overlapTop, overlapBottom);
          if (minX < minY) ball.vx *= -1;
          else ball.vy *= -1;

          b.hp -= 1;
          if (b.hp <= 0) {
            bricks.splice(i, 1);
            score += 50;
          } else {
            score += 20;
          }
          updateHud();
          break;
        }
      }

      if (ball.y - ball.r > canvas.height) {
        lives -= 1;
        updateHud();
        if (lives <= 0) {
          state = 'OVER';
          overTitle.textContent = 'Game Over';
          overMsg.textContent = `Final Score: ${score} · Level ${level}`;
          overOverlay.classList.remove('hidden');
          return;
        }
        resetBall();
      }

      if (bricks.length === 0) {
        level += 1;
        score += 200;
        buildBricks(level);
        resetBall();
        updateHud();
      }
    }

    function draw() {
      ctx.fillStyle = '#0f1622';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (bricks) {
        for (const b of bricks) {
          ctx.fillStyle = b.color;
          ctx.globalAlpha = b.hp > 1 ? 1 : 0.88;
          ctx.fillRect(b.x, b.y, b.w, b.h);
          if (b.hp > 1) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
          }
        }
        ctx.globalAlpha = 1;
      }

      if (paddle) {
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h);
      }

      if (ball) {
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    lastTime = performance.now();
    requestAnimationFrame(loop);

    document.getElementById('startBtn').addEventListener('click', init);
    document.getElementById('againBtn').addEventListener('click', init);
  </script>
</body>
</html>
