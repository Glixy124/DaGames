<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultPlay — Unblocked Browser Games</title>
    <meta name="description" content="Instant-search unblocked browser games portal powered by an iframe JSON catalog." />
    <meta property="og:title" content="VaultPlay — Unblocked Browser Games" />
    <meta property="og:description" content="Instant-search unblocked browser games portal powered by an iframe JSON catalog." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0B0F17] text-[#F1F5F9] antialiased selection:bg-amber-500/30 selection:text-amber-100">
    <div id="root"></div>
    <script id="app-entry" type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var booted = false;
        function bootFallback() {
          if (booted || window.__VAULTPLAY_MOUNTED__) return;
          booted = true;
          var s = document.createElement('script');
          s.src = './static-entry.js';
          document.body.appendChild(s);
        }
        var entry = document.getElementById('app-entry') || document.querySelector('script[type="module"]');
        if (entry) {
          entry.addEventListener('error', bootFallback);
        }
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(bootFallback, 2000);
        });
      })();
    </script>
  </body>
</html>
